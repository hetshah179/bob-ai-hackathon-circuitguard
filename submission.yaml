submission:
  title: "AI PCB Doctor"

  problem_statement: >
    "Manual PCB inspection is time-consuming, repetitive, and dependent on technician experience.
    Visible defects such as solder bridges, missing components, burnt areas, and damaged traces can be overlooked during inspection.
    An AI-assisted visual inspection system can help identify suspicious visible defects faster."

  solution_summary: >
    "AI PCB Doctor is an AI-assisted visual PCB inspection system that analyzes uploaded PCB images,
    identifies potential visible defects, classifies the fault, estimates confidence and severity,
    indicates the approximate suspicious region, and provides a recommended corrective action."

  key_features:
    - "AI-assisted visual inspection of PCB images"
    - "Visible PCB defect classification"
    - "Confidence and severity assessment"
    - "Approximate defect location identification"
    - "Recommended corrective action and inspection report"

  tech_stack:
    languages: []
    frameworks: []
    ibm_technologies: []
    databases: []
    other: []

  what_we_are_most_proud_of: >
    "We are proud of transforming a repetitive PCB inspection task into an AI-assisted visual inspection workflow
    that combines visible defect identification with confidence, severity, probable cause, and recommended corrective action."

  known_limitations: >
    "The system focuses on visible PCB defects that can be inferred from an image.
    It cannot reliably detect hidden electrical faults, internal IC failures, incorrect component values,
    intermittent connections, or defects that are not visually observable.
    Results may also depend on image quality, lighting, camera angle, and visibility of the defect."

